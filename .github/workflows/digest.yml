name: PaperSage Digest

# Runs twice a week — Monday and Thursday at 02:30 UTC (08:00 IST).
# You can also trigger it manually from the Actions tab.
on:
  schedule:
    - cron: "30 2 * * 1,4"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PaperSage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          # Optional overrides (set as repo secrets/vars if you want to change them):
          PAPERSAGE_TOPICS: ${{ vars.PAPERSAGE_TOPICS }}
          SUMMARIZER_MODEL: ${{ vars.SUMMARIZER_MODEL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          # Twice-weekly cadence leaves 3-4 day gaps; look back far enough to
          # not miss papers between runs (override via repo variable if desired).
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '4' }}
          MAX_PAPERS: ${{ vars.MAX_PAPERS }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python main.py
